schema_version: 2
config_kind: fees

# Marketplace selling fees.
#
# THE BASE IS NOT THE SAME EVERYWHERE AND MUST NOT BE FLATTENED. eBay US
# charges on item + shipping + sales tax; Cardmarket charges on the item alone;
# Mercari JP charges on the item alone because JP pricing is
# shipping-included. Treating those as one "percentage" is what produced the
# 15.37 against 13.25 discrepancy, and the engine refuses a schedule whose
# `base` is null rather than guessing which one was meant.
#
# Bands are MARGINAL. A 13.25% band up to 7,500 followed by 2.35% above means
# the second rate applies only to the portion above 7,500.

meta:
  verified_on: "2026-08-14"
  verified_by: user
  staleness_warn_days: 60
  home_currency: GBP
  home_region: GB
  provisional: true
  provisional_note: >-
    Rates read 2026-08-14. eBay UK's trading-card exception is secondary and
    flagged. Re-check before pricing a real sale.

marketplaces:
  ebay:
    display_name: "eBay US"
    currency: USD
    source: primary
    checked_on: "2026-08-14"
    confidence: medium
    primary_source_url: "https://www.ebay.com/help/selling/fees-credits-invoices/selling-fees"
    category: "Trading cards (singles)"
    fee_schedule:
      base: item_plus_shipping_plus_tax
      bands:
        - {up_to: 7500.0, pct: 0.1325}
        - {up_to: null, pct: 0.0235}
      discount:
        applies_at_or_above: 1000.0
        note: >-
          Promotional: 50% off the final value fee on cards at or above 1,000,
          applied to the portion up to 7,500.
        bands:
          - {up_to: 7500.0, pct: 0.06625}
          - {up_to: null, pct: 0.0235}
      payment:
        pct: 0
        fixed_bands:
          - {up_to: 10.0, fee: 0.30}
          - {up_to: null, fee: 0.40}
        note: "Per order, not per item."
      source: primary
      checked_on: "2026-08-14"
      confidence: medium
    # The older flat trio is superseded by the schedule above. Left null so a
    # caller that reaches for it gets a refusal rather than a stale number.
    final_value_fee_pct: null
    payment_pct: null
    payment_fixed: null
    fx_conversion_pct: null

  ebay_uk:
    display_name: "eBay UK"
    currency: GBP
    source: "secondary, unverified"
    checked_on: "2026-08-14"
    confidence: low
    needs_primary_verification: true
    seller_type: private
    category: "Trading cards (authenticity-checked exception)"
    fee_schedule:
      base: item_plus_shipping
      # Private sellers pay no selling fee on most categories. Trading cards are
      # an authenticity-checked EXCEPTION and are charged. Recording the general
      # zero here would price every UK sale at par and be wrong by ~13%.
      free_below: 150.0
      free_below_note: >-
        No fee on sales at or under 150. Above it, the bands below apply to the
        whole sale, not only the excess.
      bands:
        - {up_to: 5000.0, pct: 0.128}
        - {up_to: null, pct: 0.03}
      payment:
        pct: 0
        fixed_bands:
          - {up_to: null, fee: 0.30}
      vat_on_fee_pct: 0.20
      vat_on_fee_note: >-
        20% VAT is charged ON the fee itself, so the cash cost of a 12.8% fee is
        15.36% of the fee base. This is a fee-on-fee, not a fee-on-goods, and is
        NOT modelled by the engine's band arithmetic yet -- see the audit note.
      source: "secondary, unverified"
      checked_on: "2026-08-14"
      confidence: low
    final_value_fee_pct: null
    payment_pct: null
    payment_fixed: null
    fx_conversion_pct: null

  tcgplayer:
    display_name: TCGplayer
    currency: USD
    source: primary
    checked_on: "2026-08-14"
    confidence: medium
    commission_effective_from: "2026-02-10"
    fee_schedule:
      base: item
      base_note: >-
        Commission is charged on the ITEM. The transaction fee below is charged
        on the FULL ORDER TOTAL, which is a different base -- two bases in one
        venue, which is why this cannot collapse to a single percentage.
      bands:
        - {up_to: null, pct: 0.1075}
      commission_cap_per_product: 75.0
      payment:
        pct: 0.025
        pct_base: order_total
        fixed_bands:
          - {up_to: null, fee: 0.30}
      source: primary
      checked_on: "2026-08-14"
      confidence: medium
    non_us_seller:
      payment_pct: 0.035
      payment_fixed: 0.30
      paypal_pct: 0.02
      paypal_cap: 20.0
      note: >-
        Applies to me from September. The PayPal cut is capped at 20 per
        payout, so it is not a flat percentage either.
      source: primary
      checked_on: "2026-08-14"
      confidence: low
      needs_primary_verification: true
    final_value_fee_pct: null
    payment_pct: null
    payment_fixed: null
    fx_conversion_pct: null

  cardmarket:
