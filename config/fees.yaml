# Marketplace fees and shipping bands.
#
# STATUS: SCHEMA ONLY. Every value is null and carries NEEDS_VALUE.
# The engine REFUSES to compute while any required value is null.
#
# Rules for filling this in:
#   * Percentages are decimal fractions, NOT percent: 0.1325 not 13.25.
#   * `final_value_fee_pct` is the marketplace's commission. `payment_pct`
#     and `payment_fixed` are the payment processor's cut, which on some
#     venues is bundled into the commission -- if it is bundled, set the
#     payment fields to 0 and say so in `notes`, do not leave them null.
#   * Fees frequently differ by category and by seller status. Record the
#     category you actually sell in, in `category`.
#   * Shipping bands are what I PAY to ship, by weight band, in the venue's
#     currency. Model A subtracts outbound shipping from proceeds.
#   * Cross-border: `fx_conversion_pct` is the spread the venue or processor
#     charges when settling into my home currency. It is not the FX rate.

schema_version: 1
config_kind: fees

meta:
  verified_on: null            # NEEDS_VALUE  ISO date
  verified_by: null            # NEEDS_VALUE
  staleness_warn_days: 60
  home_currency: null          # NEEDS_VALUE  currency I actually settle in
  home_region: null            # NEEDS_VALUE  e.g. GB, US, JP -- drives which defaults apply

