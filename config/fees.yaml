    confidence: medium
    fee_schedule:
      base: item
      base_note: >-
        ITEM ONLY, because JP listings are shipping-included: the seller pays
        postage out of the sale price rather than charging it on top. Mercari US
        is NOT the same -- it charges on item + shipping. Different venues,
        different bases, kept separate on purpose.
      bands:
