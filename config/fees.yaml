# Marketplace fees and shipping bands.
#
# STATUS: PROVISIONAL for eBay, TCGplayer and Mercari US. Every populated
# value carries source: "secondary, unverified", checked_on: 2026-08-13 and
# confidence: low. The engine warns on EVERY unverified entry regardless of
# age -- a value never checked against its primary source was never fresh.
#
# Still null and REFUSING, by decision: Mercari JP, SNKRDUNK, Xianyu,
# Cardmarket, and all of my own shipping bands.
#
# FEE SCHEDULE SHAPE -- why this is not a single percentage
# ---------------------------------------------------------
# A flat `final_value_fee_pct` understates real fees three different ways, so
# schedules are modelled explicitly:
#
#   base    what the percentage multiplies. eBay charges on item + shipping +
#           tax, so 13.25% of the item price alone is NOT the fee.
#   bands   marginal rate bands. Each rate applies only to the portion of the
#           base inside that band, exactly like a tax bracket. Applying the
#           top rate to the whole amount is the classic error.
#   discount  a schedule that REPLACES `bands` at or above a threshold. It is
#           not applied on top of them.
#   fixed_bands  tiered per-order fixed fee, keyed on the item price.
#
# Percentages are decimal fractions: 0.1325, not 13.25.

schema_version: 2
config_kind: fees

meta:
  verified_on: null            # NEEDS_VALUE -- set only when read from primary sources
  verified_by: null            # NEEDS_VALUE
  staleness_warn_days: 60
  home_currency: null          # NEEDS_VALUE -- mine to declare
  home_region: null            # NEEDS_VALUE
  provisional: true
  provisional_note: >-
    eBay, TCGplayer and Mercari US populated 2026-08-13 from a secondary
    summary. Not read from any marketplace's own fee page.

marketplaces:

  ebay:
    display_name: eBay
    currency: USD
    source: "secondary, unverified"
    checked_on: "2026-08-13"
    confidence: low
    primary_source_url: "https://www.ebay.com/help/selling/fees-credits-invoices/selling-fees"
    category: "Trading cards (singles)"
    fee_schedule:
      base: item_plus_shipping_plus_tax
      bands:
        - up_to: null
          pct: 0.1325
      # Singles at or above $1000: half rate on the portion up to $7500,
      # 2.35% on everything above. A single card can straddle $7500, which is
      # why these are marginal bands and not a lookup.
      discount:
        applies_at_or_above: 1000.00
        note: "50% off FVF for the portion up to 7500, 2.35% above"
        bands:
          - up_to: 7500.00
            pct: 0.06625
          - up_to: null
            pct: 0.0235
      payment:
        # Payment processing is bundled into the FVF on eBay's managed
        # payments; the per-order fixed charge is the separate part.
        pct: 0
        fixed_bands:
          - up_to: 10.00
            fee: 0.30
          - up_to: null
            fee: 0.40
      source: "secondary, unverified"
      checked_on: "2026-08-13"
      confidence: low
    fx_conversion_pct: null    # NEEDS_VALUE
    international_fee_pct: null # NEEDS_VALUE
    store_subscription_monthly: null # NEEDS_VALUE
    shipping_bands: null       # NEEDS_VALUE -- my own postage costs
    notes: >-
      Fee base includes shipping and tax, so the effective rate on the item
      price alone always exceeds 13.25%.

  tcgplayer:
    display_name: TCGplayer
    currency: USD
    source: "secondary, unverified"
    checked_on: "2026-08-13"
    confidence: low
    primary_source_url: "https://help.tcgplayer.com/hc/en-us/articles/201853117-Seller-Fees"
    category: "Trading cards (singles)"
    fee_schedule:
      base: item_plus_shipping_plus_tax
      bands:
        - up_to: null
          pct: 0.1075
      payment:
        pct: 0.025
        base: item_plus_shipping_plus_tax
        fixed: 0.30
      source: "secondary, unverified"
      checked_on: "2026-08-13"
      confidence: low
    fx_conversion_pct: null    # NEEDS_VALUE
    international_fee_pct: null # NEEDS_VALUE
    store_subscription_monthly: null # NEEDS_VALUE
    shipping_bands: null       # NEEDS_VALUE
    notes: >-
      10.75% commission plus 2.5% and $0.30 processing, all on the full order
      total including tax.

  mercari_us:
    display_name: Mercari US
    currency: USD
    source: "secondary, unverified"
    checked_on: "2026-08-13"
    confidence: low
    primary_source_url: "https://www.mercari.com/help_center/"
    category: "Trading cards"
    fee_schedule:
      # The source gave the rates but NOT what they multiply. A percentage
      # without its base is not a fee, so this stays null and the engine
      # refuses rather than assuming item-only and understating the stack.
      base: null               # NEEDS_VALUE -- fee base not stated by the source
      bands:
        - up_to: null
          pct: 0.10
      payment:
        pct: 0.029
        fixed: 0.50
      source: "secondary, unverified"
      checked_on: "2026-08-13"
      confidence: low
      blocking_gap: "base"
    fx_conversion_pct: null    # NEEDS_VALUE
    international_fee_pct: null # NEEDS_VALUE
    store_subscription_monthly: null # NEEDS_VALUE
    shipping_bands: null       # NEEDS_VALUE
    notes: >-
      10% + 2.9% + $0.50 per the secondary source. The fee base was not
      stated, so this marketplace refuses until it is confirmed.

