# Per-submission and per-card costs I bear regardless of grader.
# All ESTIMATES. Nothing here has been paid yet.
submission_costs:
  # Route freight lives in `routes` above, because it is the thing that differs
  # between a domestic and a transatlantic submission. These are the costs that
  # do not.
  supplies_per_card: 0.50
  supplies_per_submission: 5
  default_batch_size: 10
  inbound_insurance: 0
  # Kept for the engine's flat-path callers; the route figures supersede these
  # and a route-aware call reads grading.routes.<route>.* instead.
  inbound_shipping: null
  return_shipping_insured: null
  estimated: true
  source: user estimate
  checked_on: "2026-08-14"
  confidence: low
  calibration_plan: "replace with actuals from first submission"
  note: >-
    supplies_per_card is a Card Saver, a sleeve and a team bag. Per-submission
    supplies are the mailer, box and tape, divided by batch size. Freight is
    per submission and lives on the route.
