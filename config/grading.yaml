schema_version: 2
config_kind: grading

# Grading fees, turnaround, routes and cross-border import charges.
#
# Sourcing is per entry. PSA and CGC were read from the grader's own pricing
# page on 2026-08-14 and are marked `primary`. BGS, SGC and TAG were not: they
# come from a secondary aggregator and every one of them carries
# needs_primary_verification: true.
#
# `provisional: true` stays set on the file until every figure has been
# re-checked at submission time. Grading prices move without notice -- PSA
# paused four tiers outright in June -- and a fee read three weeks ago is not
# evidence about a fee today.

meta:
  verified_on: "2026-08-14"
  verified_by: user
  staleness_warn_days: 60
  currency: USD
  currency_source: primary
  currency_checked_on: "2026-08-14"
  provisional: true
  provisional_note: >-
    PSA and CGC read from their own pricing pages 2026-08-14. BGS, SGC and TAG
    are secondary and flagged. Everything here is re-checked at submission time;
    a paused tier can reopen and an active one can pause between now and then.

# ---------------------------------------------------------------------------
# Import charges on the return leg.
#
# A card sent from the UK to a US grader can be treated as a fresh import when
# it comes back: import VAT plus customs duty on the FULL declared value of the
# graded card, not on the value grading added.
#
# The two percentages do not simply add. Duty is charged on goods plus freight;
# VAT is charged on goods plus freight PLUS the duty. See
# engine/ev/imports.py::effective_rate -- 20% and 2% compound to 22.4% of the
# goods value before freight is counted at all.
import_charges:
  home_jurisdiction: GB
  GB:
    vat_pct: 0.20
    duty_pct: 0.02
    commodity_code: "9504 40 00 00"
    commodity_description: "Playing cards"
    duty_base: goods_plus_freight
    vat_base: goods_plus_freight_plus_duty
    source: primary
    checked_on: "2026-08-14"
    confidence: medium
    needs_primary_verification: true
    note: >-
      Commodity code and headline rates are published. Whether a graded card
      re-entering the UK is treated as a fresh import or relieved is NOT
      published for this case -- see assumptions.relief_scenario.

# ---------------------------------------------------------------------------
# Routes. A route is a grader plus the facility the card is actually graded at,
# because that is what decides whether the return leg crosses a border. CGC
# operates a UK facility, so a CGC UK submission never re-imports.
#
# Freight is per SUBMISSION, not per card. Divide by batch size.
# Every figure below is an ESTIMATE and none has been paid yet.
