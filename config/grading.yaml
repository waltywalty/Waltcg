# Grading service tiers, fees and turnarounds.
#
# STATUS: SCHEMA ONLY. Every value is null and carries NEEDS_VALUE.
# The engine REFUSES to compute while any required value is null -- it does
# not warn, it does not substitute a default, it raises ConfigIncomplete and
# names every missing path. Fill these in from the sources cited per block.
#
# Rules for filling this in:
#   * Every number needs `source` (a URL) and `checked_on` (ISO date).
#   * `effective_from` is the date the grader's price list took effect, which
#     is NOT the date you looked it up. Both are recorded.
#   * Tier keys below are structural. The marketing NAMES must be confirmed
#     against each grader's live services page -- do not assume they are
#     unchanged.
#   * Fees are per card unless the tier is bulk-priced; say which in `unit`.
#
# Known context to verify, NOT to trust as fact:
#   PSA paused its four Value tiers in June 2026 against a backlog reported
#   around 10M cards, and Regular turnaround was running roughly 50-60
#   business days. That is the state this config was scaffolded against. It
#   is a claim to check, not a value to enter. If the pause has lifted, set
#   availability to "open" and record the date you confirmed it.

