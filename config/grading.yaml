# Grading service tiers, fees and turnarounds.
#
# STATUS: PROVISIONAL. Every populated value below carries
#   source: "secondary, unverified"
#   checked_on: 2026-08-13
#   confidence: low
# meaning it came from a secondary summary, NOT from the grader's own page.
#
# The engine warns on EVERY unverified entry regardless of age. A value that
# was never checked against its primary source is not "fresh for 60 days" --
# it was never fresh. Age-based staleness is a separate, weaker signal.
#
# PSA entries additionally carry needs_primary_verification: true. Sources
# disagree on the Value tier prices, the backlog size and the membership cost,
# so psacard.com is the only authority and nothing here should be trusted
# until it is read directly.
#
# Values still null and REFUSING (deliberate):
#   * submission_costs.* -- my own inbound shipping, supplies, batch size
#   * every grader's membership cost and declared-value caps
# The engine raises ConfigIncomplete naming each one rather than computing
# around it.

