name: ingest

# Daily snapshot run. GOAL D1 wants >=90 consecutive days with zero SILENT
# gaps, so the job's contract is: every source either writes rows or writes a
# gap row saying why it did not.
#
# WHAT RUN #3 GOT WRONG. A preflight step raised on the first absent key and
# killed the job before the runner started -- so one deliberately-deferred paid
# provider stopped four working ones, no store was created, no artifact was
# uploaded, and the summary came back empty because it read a database that the
# failure had prevented from existing. The step that explains a failure must
# never depend on the thing that failed.
#
# Now: preflight CLASSIFIES and never aborts, the runner decides the exit code,
# and the summary is written by the runner from its own results.
#
#   absent by choice (ingest/sources.yml expected:false) -> gap row, exit 0
#   configured but failed                                -> exit 1
#   zero sources ingested any rows                       -> exit 1
#
# The store is not committed. store/*.duckdb and raw/ are gitignored and
# no-provider-data hard-fails on a committed payload -- code may be public,
# data never is.

on:
  schedule:
    # 06:15 UTC. Off the hour on purpose: everything in the world fires at :00.
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "comma-separated source names, or 'all'"
        default: "all"

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

env:
  DB: store/waltcg.duckdb
  RESULTS: ingest-results.json

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # v5 / v6 run on Node 24. v4 / v5 respectively are the Node 20 majors
      # that GitHub deprecated, which is what the run #3 warning was about.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      # Reports. Does NOT abort. Which absences matter is decided by
      # ingest/sources.yml, and the runner enforces it -- this step exists so
      # the log says up front what the run is about to do.
      # WHAT RUN #4 GOT WRONG. This step used to be a Python heredoc, and the
      # heredoc read `key_length` on its ready branch -- correct for five
      # key-bearing adapters, a KeyError on the first keyless one. The job died
      # in fifteen seconds, before any provider ran, and the summary was empty
      # because the runner never started.
      #
      # A shell heredoc inside a YAML file is not reachable from the test
      # suite, so nothing could have caught it. The formatter now lives in
      # ingest/runner.py where tests/test_ingest_runner.py exercises it,
      # including against a keyless adapter and a module that will not import.
      # continue-on-error because a REPORT must never be able to fail a run.
      - name: Preflight -- report key presence, never abort, never print a key
        continue-on-error: true
        env:
          TCGAPI_KEY: ${{ secrets.TCGAPI_KEY }}
          PPT_KEY: ${{ secrets.PPT_KEY }}
          APITCG_KEY: ${{ secrets.APITCG_KEY }}
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: python -m ingest.runner --preflight --summary "$GITHUB_STEP_SUMMARY"

      # Every adapter module imports from requirements.txt alone. This is the
      # check from 60ade11 made permanent: that failure passed locally because
      # the session environment already had jsonschema installed and never
      # declared it. The runner tolerates a broken import now -- it is one
      # broken source, not a dead run -- but tolerating it is not the same as
      # wanting it, so this reports every module that would not load.
      - name: Every adapter imports from requirements.txt alone
        continue-on-error: true
        run: python -m ingest.registry

      # The measurement the sandbox cannot take. The three open Chinese catalog
      # sources were written against documentation, in an environment whose
      # egress proxy answers 403 to CONNECT for all three hosts, so their
      # coverage is UNKNOWN rather than assumed. This step is the experiment.
      #
      # It never fails the job: zero coverage is a finding, and a finding that
      # takes the run down cannot be read.
      - name: Measure Chinese catalog coverage -- report, never assume
        continue-on-error: true
        run: python -m ingest.catalog --coverage --summary "$GITHUB_STEP_SUMMARY"

      # THE STEP THAT SHOULD HAVE COME FIRST. `rarity` is absent from tcgdex's
      # brief card object; the catalog filtered on it anyway; 8,313 cards
      # produced zero matches. This asks the service what rarity strings each
      # dataset actually contains, and diffs each language against English.
      #
      # The documented enum and the populated one are different questions.
      # interfaces.d.ts lists 43 strings and says the vocabulary is still being
      # aligned to official lists, so anything here that is not in our enum is
      # classified `unknown` -- and `unknown` is TRACKED, never dropped.
      - name: Which rarities each tcgdex dataset actually contains
        continue-on-error: true
        run: python -m ingest.catalog --rarities --summary "$GITHUB_STEP_SUMMARY"

      # MUST come before the ingest step. Run #5 went green having ingested
      # 8,313 card identities and zero prices: tcgapi, PPT and apitcg each
      # reported "0 calls made this run" because targets.json was still the
      # hand-authored stub with an empty card list, so each looped over nothing.
      # Identities without prices is not a snapshot.
      #
      # continue-on-error, but that is not the safety net -- the runner refuses
      # a price source with no targets (`no_targets`, which fails the run), so
      # a catalog step that silently produced nothing cannot pass as a green
      # run a second time. This is the guard; that is the backstop.
      #
      # WHAT RUN #7 GOT WRONG, and it is the run #4 lesson repeating. This step
      # was `python -m ingest.catalog --write` followed by a shell block that
      # wrote the summary. The catalog found zero cards and returned 1; GitHub
      # runs `bash -e`; the script aborted on that exit code; and the block
      # that would have EXPLAINED the zero never executed. `continue-on-error`
      # then hid the failed step, so the run reported nothing at all about the
      # thing that produced the input for everything downstream.
      #
      # One command now. `--summary` is written inside Python, BEFORE the exit
      # code is returned, so no exit code and no shell option can suppress it.
      # There is no shell logic left in this step to get wrong.
      - name: Build targets from the catalogs -- BEFORE anything prices them
        continue-on-error: true
        env:
          TCGAPI_KEY: ${{ secrets.TCGAPI_KEY }}
          APITCG_KEY: ${{ secrets.APITCG_KEY }}
        run: python -m ingest.catalog --write --summary "$GITHUB_STEP_SUMMARY"

      # Always runs to completion. The exit code is the runner's decision.
      - name: Run adapters and write snapshots
        id: ingest
        continue-on-error: true
        env:
          TCGAPI_KEY: ${{ secrets.TCGAPI_KEY }}
          PPT_KEY: ${{ secrets.PPT_KEY }}
          APITCG_KEY: ${{ secrets.APITCG_KEY }}
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: |
          python -m ingest.runner \
            --db "$DB" \
            --sources "${{ github.event.inputs.sources || 'all' }}" \
            --targets ingest/targets.json \
            --results "$RESULTS" \
            --summary "$GITHUB_STEP_SUMMARY"

      # Built from the results file, not from the database, so it renders even
      # when the run produced nothing. If even that is missing, say so rather
      # than leaving the summary blank -- an empty summary is the one outcome
      # that explains nothing.
      - name: Summary fallback
        if: always()
        run: |
          if [ ! -s "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo "### Ingest run"
              echo
              echo "**The runner produced no summary.** That means it did not"
              echo "reach its reporting step -- an import error, a crash, or a"
              echo "timeout. The step log above is the only record."
              echo
              if [ -s "$RESULTS" ]; then
                echo "Raw results were written:"
                echo '```json'
                cat "$RESULTS"
                echo '```'
              else
                echo "No results file was written either."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Uploaded whatever happened. A run that failed is exactly when the
      # database and the gap rows are worth having.
      - name: Upload snapshot (never committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waltcg-snapshot-${{ github.run_id }}
          path: |
            store/waltcg.duckdb
            ingest-results.json
          retention-days: 30
          if-no-files-found: warn

      - name: Data guard
        if: always()
        run: python -m audit.checks.no_provider_data --verbose

      # The runner's exit code, applied after the artifact is safely uploaded.
      - name: Fail the job if the run failed
        if: always() && steps.ingest.outcome == 'failure'
        run: |
          echo "::error::ingest failed -- see the job summary for which sources"
          exit 1
