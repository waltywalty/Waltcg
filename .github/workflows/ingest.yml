name: ingest

# Daily snapshot run. GOAL D1 wants >=90 consecutive days with zero SILENT
# gaps, so the job's contract is: every source either writes rows or writes a
# gap row saying why it did not, and the job goes RED when any source failed.
#
# It does not commit the database. store/*.duckdb and raw/ are gitignored, and
# no-provider-data hard-fails on a committed payload -- the run uploads an
# artifact instead. Code may be public; data never is.

on:
  schedule:
    # 06:15 UTC daily. Off the hour on purpose: every scheduled job in the
    # world fires at :00 and GitHub queues them.
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "comma-separated source names, or 'all'"
        default: "all"

permissions:
  contents: read

concurrency:
  # Never two runs writing snapshots for the same day.
  group: ingest
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      # Fails the job before a single request if a key is missing, rather than
      # sending an unauthenticated call whose generic failure would be recorded
      # as "the source had nothing".
      - name: Preflight -- keys present, never printed
        env:
          TCGAPI_KEY: ${{ secrets.TCGAPI_KEY }}
          PPT_KEY: ${{ secrets.PPT_KEY }}
          APITCG_KEY: ${{ secrets.APITCG_KEY }}
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: |
          python - <<'PY'
          import json
          from ingest.adapters import ADAPTERS
          absent = []
          for name, cls in ADAPTERS.items():
              info = cls().preflight()
              print(json.dumps(info))
              if info["key_required"] and not info["ready"]:
                  absent.append(f"{name} ({info['env']})")
          if absent:
              raise SystemExit(
                  "keys absent: " + ", ".join(absent) +
                  "\nThese sources would be UNTESTED, which is a gap and not a "
                  "zero. Set the secrets or run with --sources to exclude them.")
          PY

      - name: Run adapters and write snapshots
        env:
          TCGAPI_KEY: ${{ secrets.TCGAPI_KEY }}
          PPT_KEY: ${{ secrets.PPT_KEY }}
          APITCG_KEY: ${{ secrets.APITCG_KEY }}
          PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: |
          python -m ingest.runner \
            --db store/waltcg.duckdb \
            --sources "${{ github.event.inputs.sources || 'all' }}" \
            --targets ingest/targets.json

      - name: Coverage -- report gaps loudly
        if: always()
        run: |
          python - <<'PY'
          import datetime as dt, json, sys
          from store.db import Store
          store = Store("store/waltcg.duckdb", read_only=True)
          gaps = store.con.execute(
              "SELECT source, kind, reason, count(*) FROM ingest_gap "
              "WHERE CAST(observed_at AS DATE) = CURRENT_DATE "
              "GROUP BY 1,2,3 ORDER BY 4 DESC").fetchall()
          seal = store.verify_seal()
          print(json.dumps({"gaps_today": gaps, "seal": seal}, default=str, indent=2))
          if not seal["intact"]:
              sys.exit("SEAL BROKEN: history was modified outside the writer")
          PY

      # The database is provider data. It is uploaded as a private artifact and
      # never committed -- CLAUDE.md non-negotiable 10, enforced by
      # audit/checks/no_provider_data.py on every push including this one.
      - name: Upload snapshot (never committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waltcg-snapshot-${{ github.run_id }}
          path: store/waltcg.duckdb
          retention-days: 30
          if-no-files-found: error

      - name: Data guard
        if: always()
        run: python -m audit.checks.no_provider_data --verbose

      - name: Summary
        if: always()
        run: |
          {
            echo "### Ingest run"
            echo
            echo '```'
            python - <<'PY'
          from store.db import Store
          store = Store("store/waltcg.duckdb", read_only=True)
          for row in store.con.execute(
                  "SELECT source, status, rows_written, gaps_written, detail "
                  "FROM ingest_run WHERE finished_at IS NOT NULL "
                  "ORDER BY started_at").fetchall():
              print(row)
          PY
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
