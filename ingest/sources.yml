# Which sources this project expects to be configured, and which are absent on
# purpose.
#
# The distinction matters because "no key" has two completely different
# meanings and a run that treats them alike is useless in both directions:
#
#   expected: true   -- I meant to configure this. A missing key is a FAILURE,
#                       because the alternative is a run that goes green while
#                       quietly collecting nothing from a source I rely on.
#   expected: false  -- deliberately deferred. A missing key is a GAP ROW and
#                       the run carries on. The gap is still recorded, so the
#                       store never implies the source was consulted.
#
# A deferred source whose key IS present runs anyway. Adding the secret is how
# you turn one on; you do not have to edit this file first.

sources:
  tcgapi:
    expected: true
    note: "Catalog and raw prices. Free tier, 100/day."

  pokemonpricetracker:
    expected: true
    note: >-
      The only source of per-grade population, and the only one that returns
      sales by grade AND grader together -- which is what makes the CGC-10 /
      PSA-10 ratio computable at all.

  apitcg:
    expected: true
    note: "Catalog and the only reliable artist field. Free."

  fx_alphavantage:
    expected: true
    note: >-
      FX only. Every cross-currency figure rests on this one source, so a gap
      here is not cosmetic -- the engine refuses to convert without a rate.

  # --- catalog-only, keyless, and never yet exercised ---------------------
  #
  # `unverified: true` means the adapter was written against documentation and
  # has not reached its live service once. A failure is recorded as a gap with
  # the full error rather than failing the run, because the first real run is
  # the experiment that establishes the endpoint shape and it should not take
  # four working providers down with it.
  #
  # Remove `unverified` the moment one of these returns rows. That promotes it
  # to a hard dependency, which is the correct state for a source we rely on.

  # VERIFIED on run #5: 877 cards for pkmn:CN-S and 7,436 for pkmn:CN-T. The
  # `unverified` flag is gone, which promotes it to a hard dependency -- a
  # failure here now fails the run, which is the correct state for the only
  # source either Chinese Pokemon printing has.
  tcgdex:
    expected: true
    verified_on: "2026-08-17"
    note: >-
      Open Pokemon database, no key. The sole catalog source for both Chinese
      Pokemon printings. Pokemon only -- it does not close One Piece CN-S,
      which remains manual.

  # Superseded, not deleted. Its endpoint guess was wrong (tcg.mik.moe/api/sets
  # returned non-JSON) and tcgdex covers everything it was for, so leaving it
  # in the rotation would spend a request every run proving a known-wrong URL
  # is still wrong and file the result as a gap that reads like missing data.
  #
  # Kept in the file rather than removed: "we tried this and it was superseded"
  # is a different fact from "we never considered it", and the next session
  # should not rediscover tcg.mik.moe from scratch.
  cryst:
    expected: false
    superseded_by: tcgdex
    superseded_on: "2026-08-17"
    superseded_note: >-
      Simplified Chinese Pokemon, which tcgdex now covers directly (877 cards).
      The probed endpoints all returned non-JSON. Revisit only if tcgdex drops
      zh-cn -- Cryst is sourced from Pokemon Shanghai and would be the better
      primary for the combined-set renumbering if it ever answers.

  wiki52poke:
    expected: true
    enrichment: true
    note: >-
      MediaWiki, enrichment only, and that is a capability statement rather
      than a limitation to fix. It supplies Chinese names for identities
      another source established. It deliberately cannot enumerate a set: that
      needs a category title in Chinese and a guessed one returns an empty page
      indistinguishable from an empty set. A run where nothing needed enriching
      is `enrichment_idle`, NOT a gap -- filing it as a gap every day devalues
      the gap rows that mean something.

  pricecharting:
    expected: false
    deferred_on: "2026-08-14"
    deferred_note: >-
      Paid, and deferred by choice until the Pokemon data shows whether it is
      worth it. PriceCharting is the graded-comp source for the games
      PokemonPriceTracker does not cover (One Piece, Riftbound), so deferring
      it means those games have NO graded comps -- that is a known consequence,
      recorded here rather than discovered later from an empty screen.
